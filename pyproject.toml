[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".venv-dev", "__pycache__", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
